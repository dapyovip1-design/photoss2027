<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instagram Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141414;--line:#262626;--ac:#8D36FF;--tx:#fff;--mut:#a8a8a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ac);color:#000}
header h1{flex:1;margin:0;font-size:18px;text-align:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{width:40px;height:40px;font-size:22px;border-radius:50%}
.ib:focus-visible,.card:focus-visible,.nav a:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{max-width:900px;margin:auto}
.gal{padding:12px}
.hero{position:relative;height:52vw;max-height:340px;background:#111 center 28%/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px;background-image:linear-gradient(135deg,#8D36FF,#1b0a3d)}
.hero h2{margin:0;font-size:32px;font-weight:400}.hero p{margin:0;color:#ddd;font-size:19px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 12px 24px}
.tile{position:relative;aspect-ratio:1/0.76;border-radius:22px;overflow:hidden;padding:0;background:linear-gradient(#1c1c1c,#050505);text-align:start}
.tile img{object-position:center 30%;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 45%,#000c)}
.tile span{position:absolute;inset-inline:12px;bottom:10px;z-index:1;font-weight:700;font-size:17px;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid button{padding:0;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--card)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.scrim{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.2s;z-index:8}
.nav{position:fixed;top:0;bottom:0;inset-inline-start:0;width:270px;max-width:80%;background:#0b0b0b;border-inline-end:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:9;padding:20px 0}
[dir=ltr] .nav{transform:translateX(-100%)}
body.open .nav{transform:none}body.open .scrim{opacity:1;pointer-events:auto}
.nav h3{margin:0 18px 14px;font-size:18px}
.nav a{display:block;padding:13px 18px;color:var(--tx);text-decoration:none;border-inline-start:4px solid transparent}
.nav a.on{background:#1b1030;border-color:var(--ac)}
.nav a.ig{display:flex;align-items:center;gap:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:16px;font-weight:700}
.nav a.ig svg{flex:none;color:var(--ac)}
#lb .cnt{direction:ltr}
[dir=ltr] #lb .p{right:auto;left:8px}[dir=ltr] #lb .n{left:auto;right:8px}
#lg{position:fixed;inset:0;background:#000b;z-index:25;display:none;align-items:center;justify-content:center;padding:16px}
#lg.show{display:flex}
#lg .box{width:100%;max-width:440px;max-height:82vh;display:flex;flex-direction:column;background:#111;border:1px solid var(--line);border-radius:22px;overflow:hidden}
#lg .lh{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-size:18px}
#lg .lgrid{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
#lg .lgrid button{padding:12px 8px;border-radius:12px;background:var(--card);border:2px solid transparent;font-weight:700}
#lg .lgrid button.on{border-color:var(--ac);background:#1b1030}
#lg .lgrid button:focus-visible{outline:2px solid #fff}
#lb{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#lb.show{display:flex}
#lb .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;touch-action:pan-y}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .pn{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;background:#0008;font-size:22px}
#lb .p{right:8px}#lb .n{left:8px}
#lb .dlb{margin:10px auto 0;padding:12px 30px;background:var(--ac);color:#000;border-radius:999px;font-weight:700;font-size:17px}
#toast{position:fixed;left:50%;bottom:90px;translate:-50% 0;background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
#lb .cnt{text-align:center;color:var(--mut);padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const LG={}; LGR.forEach(r=>{const o={name:r[1],rtl:r[2]}; LK.forEach((k,i)=>o[k]=r[3+i]); LG[r[0]]=o;});
const L=()=>LG[lang]||LG.ar;
const pt=i=>{const t=L();return ["Instagram photos 💜",t.anime+" 2027☔",t.love+"♥",t.neon+"💥","WhatsApp stickers 📎"][i]};
function buildLangList(){
  const g=$("lgrid"); g.innerHTML="";
  LGR.forEach(r=>{
    const b=document.createElement("button"); b.textContent=r[1]; b.lang=r[0]; b.dir=r[2]?"rtl":"ltr";
    if(r[0]===lang)b.className="on";
    b.onclick=()=>{applyLang(r[0]);$("lg").classList.remove("show")}; g.appendChild(b);
  });
}
function applyLang(c){
  if(!LG[c])c="ar"; lang=c; const t=L(), d=document.documentElement;
  d.lang=c; d.dir=t.rtl?"rtl":"ltr";
  $("menu").setAttribute("aria-label",t.menu); $("home").setAttribute("aria-label",t.home);
  $("x").setAttribute("aria-label",t.close); $("lgx").setAttribute("aria-label",t.close);
  $("sh").setAttribute("aria-label",t.share); $("prev").setAttribute("aria-label",t.prev);
  $("next").setAttribute("aria-label",t.next); $("nav").setAttribute("aria-label",t.pages);
  $("lgb").setAttribute("aria-label",t.lang); $("lgt").textContent="🌐 "+t.lang;
  $("dl").textContent="⬇ "+t.dl;
  $("prev").textContent=t.rtl?"›":"‹"; $("next").textContent=t.rtl?"‹":"›";
  try{localStorage.setItem("lang",c)}catch(e){}
  buildLangList(); go(cur);
}
let lang="ar", cur=-1, list=[], idx=0;
const $=id=>document.getElementById(id);

function ph(i,k){ // صورة تجريبية
  const h=(k*70+i*23)%360;
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},70%,55%)"/><stop offset="1" stop-color="hsl(${(h+60)%360},70%,25%)"/></linearGradient></defs><rect width="600" height="800" fill="url(#g)"/><text x="300" y="420" font-size="90" text-anchor="middle" fill="#fff8" font-family="sans-serif">${i+1}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}
APP.pages.forEach((p,k)=>{ if(!p.images.length) p.images=Array.from({length:24},(_,i)=>ph(i,k)); });

function buildNav(){
  const n=$("nav"); n.querySelectorAll("a").forEach(a=>a.remove());
  [[-1,APP.home.title],...APP.pages.map((p,i)=>[i,pt(i)])].forEach(([i,t])=>{
    const a=document.createElement("a"); a.href="#"; a.textContent=t;
    if(i===cur)a.className="on";
    a.onclick=e=>{e.preventDefault();go(i)}; n.appendChild(a);
  });
  const ig=document.createElement("a"); ig.className="ig";
  ig.href="https://www.instagram.com/dowpe_1?stkn=Y3JlZTl5MDgxZ3I4"; ig.target="_blank"; ig.rel="noopener noreferrer";
  ig.innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span>'+L().ig+'</span>';
  ig.onclick=e=>{
    if(!/Android/i.test(navigator.userAgent))return;
    e.preventDefault();
    const web=ig.href; let done=false;
    const stop=()=>{done=true}, vis=()=>{if(document.hidden)stop()};
    document.addEventListener("visibilitychange",vis);
    addEventListener("pagehide",stop,{once:true}); addEventListener("blur",stop,{once:true});
    const f=document.createElement("iframe"); f.style.display="none";
    f.src="instagram://user?username=dowpe_1"; document.body.appendChild(f);
    setTimeout(()=>{
      f.remove(); document.removeEventListener("visibilitychange",vis);
      if(done||document.hidden)return;
      const w=window.open(web,"_blank"); if(w){try{w.opener=null}catch(_){}}else location.assign(web);
    },1600);
  };
  n.appendChild(ig);
}
function go(i){
  cur=i; document.body.classList.remove("open"); window.scrollTo(0,0);
  const v=$("view"); v.innerHTML="";
  if(i<0){
    $("title").textContent=APP.home.title;
    v.innerHTML=`<div class="hero" style="background-image:linear-gradient(#0000 45%,#000b),url(${HERO})"><h2>${APP.home.heading}</h2><p>${APP.home.sub}</p></div><div class="tiles"></div>`;
    APP.pages.forEach((p,k)=>{
      const b=document.createElement("button"); b.className="tile";
      b.innerHTML=(p.cover?`<img src="${p.cover}" style="object-position:${p.pos||"center 30%"}" alt="">`:"")+`<span>${pt(k)}</span>`;
      b.onclick=()=>go(k); v.querySelector(".tiles").appendChild(b);
    });
  } else {
    const p=APP.pages[i]; $("title").textContent=pt(i);
    const g=document.createElement("div"); g.className="grid gal";
    p.images.forEach((src,j)=>{
      const b=document.createElement("button"); b.setAttribute("aria-label",(j+1)+"");
      b.innerHTML=`<img loading="lazy" src="${src}" alt="">`; b.onclick=()=>open(p.images,j); g.appendChild(b);
    });
    v.appendChild(g);
  }
  buildNav();
}
function open(l,i){list=l;idx=i;show();$("lb").classList.add("show")}
function show(){$("big").src=list[idx];$("cnt").textContent=(idx+1)+" / "+list.length}
function step(d){idx=(idx+d+list.length)%list.length;show()}
$("menu").onclick=()=>document.body.classList.add("open");
$("home").onclick=()=>go(-1);
$("scrim").onclick=()=>document.body.classList.remove("open");
$("x").onclick=()=>$("lb").classList.remove("show");
$("prev").onclick=()=>step(-1); $("next").onclick=()=>step(1);
$("dl").onclick=()=>{
  const a=document.createElement("a");
  a.href=list[idx]; a.download=list[idx].split("/").pop();
  document.body.appendChild(a); a.click(); a.remove();
};
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
async function copyLink(u){
  try{await navigator.clipboard.writeText(u);return true}catch(e){}
  try{const a=document.createElement("textarea");a.value=u;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(e){return false}
}
$("sh").onclick=async()=>{
  const url=SHARE_URL, title=$("title").textContent;
  if(navigator.share){try{await navigator.share({title,url})}catch(e){} return}
  if(/Android/i.test(navigator.userAgent)){
    let done=false; const stop=()=>{done=true};
    document.addEventListener("visibilitychange",()=>{if(document.hidden)stop()},{once:true});
    addEventListener("pagehide",stop,{once:true}); addEventListener("blur",stop,{once:true});
    const f=document.createElement("iframe"); f.style.display="none";
    f.src="intent:#Intent;action=android.intent.action.SEND;type=text/plain;S.android.intent.extra.TEXT="+encodeURIComponent(title+"\n"+url)+";end";
    document.body.appendChild(f);
    await new Promise(r=>setTimeout(r,1200)); f.remove();
    if(done||document.hidden)return;
  }
  if(await copyLink(url))toast(L().copied);
};
document.addEventListener("keydown",e=>{if(!$("lb").classList.contains("show"))return;
  if(e.key==="Escape")$("x").click(); const r=document.documentElement.dir==="rtl"; if(e.key==="ArrowLeft")step(r?1:-1); if(e.key==="ArrowRight")step(r?-1:1)});
let sx=null; const st=document.querySelector("#lb .stage");
st.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
st.addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1);sx=null});
$("lgb").onclick=()=>$("lg").classList.add("show");
$("lgx").onclick=()=>$("lg").classList.remove("show");
$("lg").addEventListener("click",e=>{if(e.target===$("lg"))$("lg").classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("lg").classList.remove("show")});
let saved="ar"; try{saved=localStorage.getItem("lang")||"ar"}catch(e){}
applyLang(saved);
